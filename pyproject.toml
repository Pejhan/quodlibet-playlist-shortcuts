[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "C", "E", "ERA", "EXE", "F", "FLY", "INT", "N", "PIE", "Q", "RET", "UP", "W"]
ignore = ["E402", "E741", "N817"]

[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["N801", "N802", "N806", "N816"]
"playlist_shortcuts.py" = ["N802"]
